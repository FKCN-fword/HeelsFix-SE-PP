name: HeelsFixNG SE 1.5.97 C++ build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Check out committed C++ source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: Verify Visual Studio 2026 toolset
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere.exe was not found; Visual Studio 2026 cannot be verified.' }
          $vsPath = & $vswhere -latest -products '*' -version '[18.0,19.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vsPath) { throw 'Visual Studio 2026 C++ tools were not found on this runner.' }
          $vsVersion = & $vswhere -latest -products '*' -version '[18.0,19.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          if ($LASTEXITCODE -ne 0 -or -not $vsVersion) { throw 'Could not read the Visual Studio 2026 installation version.' }
          $toolsetFile = Join-Path $vsPath 'VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt'
          if (-not (Test-Path -LiteralPath $toolsetFile)) { throw 'The Visual Studio C++ toolset version file is missing.' }
          $toolsetVersionText = (Get-Content -LiteralPath $toolsetFile -Raw).Trim()
          if ($toolsetVersionText -notmatch '^(\d+\.\d+\.\d+)') { throw "Unrecognized MSVC toolset version: $toolsetVersionText" }
          if ([version]$Matches[1] -lt [version]'14.50.0') { throw "MSVC v145 (14.50+) is required to match CommonLib. Detected: $toolsetVersionText" }
          Write-Host "Using Visual Studio $vsVersion / MSVC $toolsetVersionText at $vsPath"

      - name: Stage 1 — static preflight of checked-in source
        shell: pwsh
        run: |
          python tools/verify_source.py
          if ($LASTEXITCODE -ne 0) { throw 'Stage 1 static source preflight failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Stage 1 whitespace check failed.' }

      - name: Fetch build dependencies
        shell: pwsh
        run: |
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Unable to enable long-path support for dependency checkout.' }
          New-Item -ItemType Directory -Force -Path lib | Out-Null
          git clone --depth 1 --branch ng --recurse-submodules https://github.com/alandtse/CommonLibVR.git lib/CommonLibSSE-NG
          if ($LASTEXITCODE -ne 0) { throw 'CommonLibSSE-NG checkout failed.' }
          git clone --depth 1 https://github.com/QTR-Modding/SKSE-Menu-Framework-3-API.git lib/SKSE-Menu-Framework-3-API
          if ($LASTEXITCODE -ne 0) { throw 'SKSE Menu Framework API checkout failed.' }

      - name: Stage 2 — recheck source after dependency setup
        shell: pwsh
        run: |
          python tools/verify_source.py
          if ($LASTEXITCODE -ne 0) { throw 'Stage 2 static source preflight failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Stage 2 whitespace check failed.' }

      - name: Configure xmake against CommonLib prebuilt ABI
        shell: pwsh
        run: |
          xmake f -m releasedbg --vs=2026 --skyrim_se=y --skyrim_ae=y --skyrim_vr=y --rex_json=n --rex_toml=n -y
          if ($LASTEXITCODE -ne 0) { throw 'xmake configure failed. No C++ target was compiled.' }

      - name: Stage 3 — verify configured source and options
        shell: pwsh
        run: |
          python tools/verify_source.py
          if ($LASTEXITCODE -ne 0) { throw 'Stage 3 static source preflight failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Stage 3 whitespace check failed.' }

      - name: Build C++ interaction regression tests
        shell: pwsh
        run: |
          xmake build InteractionStateTests
          if ($LASTEXITCODE -ne 0) { throw 'InteractionStateTests failed to compile.' }

      - name: Stage 4 — static check after test compilation
        shell: pwsh
        run: |
          python tools/verify_source.py
          if ($LASTEXITCODE -ne 0) { throw 'Stage 4 static source preflight failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Stage 4 whitespace check failed.' }

      - name: Run C++ interaction regression tests
        shell: pwsh
        run: |
          xmake run InteractionStateTests
          if ($LASTEXITCODE -ne 0) { throw 'InteractionStateTests reported a regression.' }

      - name: Stage 5 — static check after regression tests
        shell: pwsh
        run: |
          python tools/verify_source.py
          if ($LASTEXITCODE -ne 0) { throw 'Stage 5 static source preflight failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Stage 5 whitespace check failed.' }

      - name: Build native SKSE plugin
        shell: pwsh
        run: |
          $deploy = Join-Path $env:GITHUB_WORKSPACE 'dist/HeelsFixNG-NoESP-SE1597'
          $env:HFN_DEPLOY_DIR = $deploy
          "HFN_DEPLOY_DIR=$deploy" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          xmake build HeelsFixNative
          if ($LASTEXITCODE -ne 0) { throw 'HeelsFixNative.dll compilation failed.' }
          $dll = Join-Path $deploy 'SKSE/Plugins/HeelsFixNative.dll'
          if (-not (Test-Path -LiteralPath $dll)) { throw 'Build reported success, but deployed HeelsFixNative.dll is missing.' }

      - name: Stage 6 — verify source and native binary after plugin build
        shell: pwsh
        run: |
          python tools/verify_source.py
          if ($LASTEXITCODE -ne 0) { throw 'Stage 6 final static source preflight failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Stage 6 whitespace check failed.' }
          $dll = Join-Path $env:GITHUB_WORKSPACE 'dist/HeelsFixNG-NoESP-SE1597/SKSE/Plugins/HeelsFixNative.dll'
          $bytes = [System.IO.File]::ReadAllBytes($dll)
          if ($bytes.Length -lt 256 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Output is not a valid PE/DLL candidate.' }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length -or $bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45) { throw 'PE signature is invalid.' }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw ('Expected x64 PE machine 0x8664; found 0x{0:X4}.' -f $machine) }

      - name: Stage native plugin package (no ESP or Papyrus)
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'dist/HeelsFixNG-NoESP-SE1597'
          $pluginDir = Join-Path $root 'SKSE/Plugins'
          if (-not (Test-Path -LiteralPath (Join-Path $pluginDir 'HeelsFixNative.dll'))) { throw 'Cannot stage package: native DLL is missing.' }
          Copy-Item -LiteralPath 'Runtime/HeelsFixNative.ini' -Destination $pluginDir -Force
          Copy-Item -LiteralPath 'README_INSTALL_KO.txt' -Destination $root -Force
          Copy-Item -LiteralPath 'LICENSE-MIT.txt' -Destination $root -Force
          $bad = Get-ChildItem -Path $root -Recurse -File | Where-Object { $_.Extension.ToLowerInvariant() -in @('.esp','.esm','.esl','.pex') }
          if ($bad) { throw ('Forbidden plugin/Papyrus files in package: ' + (($bad | ForEach-Object FullName) -join ', ')) }
          $required = @('SKSE/Plugins/HeelsFixNative.dll','SKSE/Plugins/HeelsFixNative.ini','README_INSTALL_KO.txt','LICENSE-MIT.txt')
          foreach ($relative in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $relative))) { throw "Required package file is missing: $relative" }
          }
          python tools/verify_source.py
          if ($LASTEXITCODE -ne 0) { throw 'Final source static checks failed after package staging.' }

      # Upload the package directory, not a ZIP file. upload-artifact creates the
      # downloadable ZIP itself; uploading a prebuilt ZIP here nests one ZIP in another.
      - name: Upload install-ready plugin package
        uses: actions/upload-artifact@v4
        with:
          name: HeelsFixNG-NoESP-SE1597
          path: dist/HeelsFixNG-NoESP-SE1597/**
          if-no-files-found: error
          retention-days: 30
